<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اللغة الإنجليزية - الوحدات</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body { background: #f4f7fb; color: #1a2b3c; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #1e3a8a; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; font-size: 24px; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    
    /* تنسيق الكارت الجديد */
    .menu-card { 
      display: flex; 
      flex-direction: column;
      background: #f8fafc; 
      padding: 20px; 
      border-radius: 12px; 
      text-decoration: none; 
      color: #1e293b; 
      border: 1px solid #e2e8f0; 
      transition: 0.3s; 
      position: relative;
      overflow: hidden;
    }
    .menu-card:hover { background: #e0f2fe; border-color: #38bdf8; transform: translateY(-2px); }
    
    /* رقم الوحدة صغير في الركن */
    .unit-badge { 
      background: #2563eb; 
      color: white; 
      font-size: 12px; 
      font-weight: bold; 
      padding: 3px 10px; 
      border-radius: 20px; 
      align-self: flex-start; 
      margin-bottom: 10px;
    }
    
    /* اسم الوحدة بشكل بارز */
    .unit-name { 
      font-size: 18px; 
      font-weight: bold; 
      color: #1e3a8a; 
      direction: ltr; 
      text-align: left;
      margin-bottom: 5px;
    }

    .back-btn { display: inline-block; background: #64748b; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; margin-bottom: 20px; font-size: 14px; }
    .back-btn:hover { background: #475569; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">← العودة للرئيسية</a>
    
    <h1>🇬🇧 اللغة الإنجليزية <br><small style="font-size:16px; color:#64748b;">اختر الوحدة الدراسية</small></h1>

    <div class="menu-grid">
      
      <a href="unit1.html" class="menu-card">
        <span class="unit-badge">Unit 1</span>
        <span class="unit-name">Inside the World of Care</span>
      </a>

      <a href="unit2.html" class="menu-card">
        <span class="unit-badge">Unit 2</span>
        <span class="unit-name">The Power of Machines</span>
      </a>

      <a href="unit3.html" class="menu-card">
        <span class="unit-badge">Unit 3</span>
        <span class="unit-name">Protect Nature, Protect Future</span>
      </a>

      <a href="unit4.html" class="menu-card">
        <span class="unit-badge">Unit 4</span>
        <span class="unit-name">Marine Life</span>
      </a>

      <a href="unit5.html" class="menu-card">
        <span class="unit-badge">Unit 5</span>
        <span class="unit-name">From Muscles to Mindset</span>
      </a>

      <a href="unit6.html" class="menu-card">
        <span class="unit-badge">Unit 6</span>
        <span class="unit-name">Let's Hang Out !</span>
      </a>

    </div>
  </div>

</body>
</html>
