<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>النصوص والقراءة - الاختيارات</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body { background: #f4f7fb; color: #1a2b3c; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #1e3a8a; text-align: center; margin-bottom: 30px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; font-size: 24px; }
    .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .menu-card { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 25px; border-radius: 10px; text-decoration: none; color: #1e293b; border: 1px solid #e2e8f0; transition: 0.3s; }
    .menu-card:hover { background: #e0f2fe; border-color: #38bdf8; transform: translateY(-2px); }
    .menu-card .info { display: flex; align-items: center; gap: 15px; }
    .menu-card .icon { font-size: 35px; }
    .menu-card h2 { font-size: 20px; margin: 0; border: none; padding: 0; color: #1e3a8a; }
    .arrow { font-size: 24px; color: #94a3b8; }
    .back-btn { display: inline-block; background: #64748b; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; margin-bottom: 20px; font-size: 14px; }
    .back-btn:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <a href="arabic.html" class="back-btn">← العودة للأقسام</a>
    <h1>📜 النصوص والقراءة<br><small style="font-size:16px; color:#64748b;">اختر القسم</small></h1>

    <div class="menu-grid">
      <a href="poems.html" class="menu-card">
        <div class="info">
          <span class="icon">📖</span>
          <h2>النصوص</h2>
        </div>
        <span class="arrow">←</span>
      </a>
      <a href="reading.html" class="menu-card">
        <div class="info">
          <span class="icon">📰</span>
          <h2>القراءة المتحررة</h2>
        </div>
        <span class="arrow">←</span>
      </a>
    </div>
  </div>
</body>
</html>
