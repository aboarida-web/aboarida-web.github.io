  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
    body { background: #f4f7fb; color: #1a2b3c; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    .header-box { text-align: center; margin-bottom: 30px; }
    .header-box h1 { color: #1e3a8a; font-size: 28px; margin-bottom: 5px; }
    .header-box h2 { color: #64748b; font-size: 18px; font-weight: normal; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
    
    .menu-card { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; padding: 25px 15px; border-radius: 12px; text-decoration: none; color: #1e293b; border: 1px solid #e2e8f0; transition: all 0.3s ease; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .menu-card:hover { background: #e0f2fe; border-color: #38bdf8; transform: translateY(-5px); box-shadow: 0 8px 15px rgba(56, 189, 248, 0.2); }
    
    .menu-card .icon { font-size: 40px; margin-bottom: 15px; }
    .menu-card h3 { font-size: 16px; margin: 0; color: #1e3a8a; font-weight: bold; }
    
    .back-btn { display: inline-block; background: #64748b; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; margin-bottom: 20px; font-size: 14px; transition: 0.3s;}
    .back-btn:hover { background: #475569; }
  </style>
<style id="abo-arida-design-system">
:root{--aa-bg:#071329;--aa-panel:#0e2040;--aa-card:#10284d;--aa-text:#edf4ff;--aa-muted:#b4c5df;--aa-line:rgba(139,180,255,.2);--aa-blue:#2878ff;--aa-cyan:#45c7ff;--aa-gold:#ffc94a;--aa-shadow:0 14px 38px rgba(0,0,0,.22)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:Tahoma,'Segoe UI',Arial,sans-serif!important;background:radial-gradient(ellipse at 15% 0%,#102b59 0%,transparent 42%),linear-gradient(160deg,#071329,#091a34 55%,#071329)!important;color:var(--aa-text)!important;min-height:100vh;line-height:1.75;overflow-x:hidden}
body *{max-width:100%}img,video,iframe{max-width:100%;height:auto}a{transition:background .2s,border-color .2s,transform .2s,color .2s}
.aa-topbar{position:relative;z-index:5;width:min(1180px,calc(100% - 28px));margin:14px auto 22px;padding:12px 16px;border:1px solid var(--aa-line);border-radius:18px;background:rgba(8,24,50,.88);box-shadow:var(--aa-shadow);display:flex;align-items:center;justify-content:space-between;gap:12px;backdrop-filter:blur(12px)}
.aa-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:17px;min-width:0}.aa-logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#2878ff,#1645a5);box-shadow:0 0 22px #2878ff55;font-size:23px;flex:none}.aa-brand small{display:block;color:#9fc5ff;font-size:10px;letter-spacing:.6px;font-weight:600;line-height:1.3}.aa-actions{display:flex;gap:8px;align-items:center}.aa-action{border:1px solid #477ac0;background:#122c54;color:#eaf3ff;border-radius:11px;padding:9px 12px;text-decoration:none;font:600 13px Tahoma,Arial;cursor:pointer;white-space:nowrap}.aa-action:hover{background:#1c4380;border-color:#65baff}
.container,.courses,.hero{width:min(1100px,calc(100% - 28px));margin:0 auto 22px!important}.container{background:linear-gradient(145deg,rgba(16,40,77,.97),rgba(10,27,54,.97))!important;color:var(--aa-text)!important;border:1px solid var(--aa-line)!important;border-radius:22px!important;padding:clamp(16px,3.5vw,34px)!important;box-shadow:var(--aa-shadow)!important}.hero{background:linear-gradient(120deg,#102d61,#0b1c3b)!important;border:1px solid var(--aa-line);border-radius:24px;padding:clamp(25px,5vw,58px) 20px!important;color:#fff!important;box-shadow:var(--aa-shadow)}
header:not(.aa-topbar){background:linear-gradient(120deg,#123d83,#102653)!important;color:#fff!important;border:1px solid var(--aa-line);border-radius:18px;padding:18px!important;width:min(1100px,calc(100% - 28px));margin:0 auto 18px;gap:12px;flex-wrap:wrap}
.hero h2,.courses h2,.header-box h1,h1{color:#eaf3ff!important}.hero p,.header-box h2{color:#bdcce3!important}.courses{padding:clamp(18px,3vw,34px) 0!important}.grid,.menu-grid{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr))!important;gap:14px!important}
.card,.menu-card,.lesson-content,.image-box,.section-title{background:linear-gradient(145deg,#122c53,#0c2040)!important;color:var(--aa-text)!important;border:1px solid var(--aa-line)!important;border-radius:17px!important;box-shadow:0 8px 22px rgba(0,0,0,.15)!important}.card,.menu-card{padding:clamp(15px,2.5vw,22px)!important}.card h3,.menu-card h3,h2,.section-title{color:#8fcaff!important}.card p,.menu-card p,.image-caption{color:var(--aa-muted)!important}.card:hover,.menu-card:hover{transform:translateY(-3px);border-color:#4daeff!important;background:linear-gradient(145deg,#173a70,#10294f)!important}
.section-title{border-right:4px solid var(--aa-cyan)!important}.lesson-content{line-height:2!important;font-size:clamp(15px,1.7vw,18px)!important;padding:clamp(15px,3vw,25px)!important;text-align:start!important}.image-box{padding:12px!important}.image-box img{display:block;margin:auto;object-fit:contain}.highlight{background:#542c3b!important;color:#ffb5bd!important}.term{background:#123d59!important;color:#8fe1ff!important}.back-btn,.btn,.price{border-radius:12px!important}.back-btn,.btn{background:linear-gradient(120deg,#2878ff,#1452c2)!important;color:white!important;border:1px solid #67b7ff!important;padding:11px 18px!important;text-decoration:none!important}.price{background:#123f42!important;color:#8af0ca!important}footer{background:#091a34!important;color:#a9c9f4!important;border-top:1px solid var(--aa-line);padding:22px!important;margin-top:30px!important}
body.aa-light{--aa-bg:#f2f6fc;--aa-panel:#fff;--aa-card:#fff;--aa-text:#172b49;--aa-muted:#536783;--aa-line:rgba(39,89,150,.18);background:linear-gradient(145deg,#eef5ff,#f7f9fd)!important;color:#172b49!important}
body.aa-light .aa-topbar,body.aa-light .container,body.aa-light .card,body.aa-light .menu-card,body.aa-light .lesson-content,body.aa-light .image-box,body.aa-light .section-title{background:#fff!important;color:#172b49!important}body.aa-light .aa-brand{color:#17345d}body.aa-light h1,body.aa-light h2,body.aa-light .card h3,body.aa-light .menu-card h3{color:#174b91!important}body.aa-light .card p,body.aa-light .menu-card p,body.aa-light .header-box h2{color:#536783!important}
@media(max-width:640px){.aa-topbar{width:calc(100% - 20px);margin:10px auto 15px;padding:10px 11px;border-radius:15px}.aa-brand{font-size:14px;gap:8px}.aa-logo{width:36px;height:36px;font-size:20px}.aa-brand small{font-size:9px}.aa-action{font-size:11px;padding:8px 9px}.container,.courses,.hero{width:calc(100% - 20px);margin-bottom:14px!important}.container{padding:16px!important;border-radius:17px!important}.hero{padding:27px 15px!important;border-radius:18px!important}.hero h2{font-size:clamp(21px,6vw,28px)!important}.hero p{font-size:14px!important}.courses{padding:18px 0!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.card{padding:14px 10px!important}.card .icon{font-size:30px!important}.card h3{font-size:16px!important}.card p{font-size:12px!important}.menu-grid{grid-template-columns:1fr!important;gap:10px!important}.menu-card{padding:14px!important}.menu-card h3{font-size:15px!important}.menu-card .info{gap:9px!important;min-width:0}.menu-card .icon{font-size:25px!important}.back-btn{padding:9px 13px!important;font-size:13px!important}.lesson-content{font-size:15px!important;line-height:1.9!important}.section-title{font-size:16px!important;padding:10px 12px!important}.image-box{margin:17px 0!important}.image-caption{font-size:13px!important}h1{font-size:22px!important}h2{font-size:19px!important}footer{font-size:12px!important;padding:18px 12px!important}}
@media(max-width:360px){.aa-brand{font-size:12px}.aa-actions{gap:5px}.aa-action{font-size:10px;padding:7px}.grid{grid-template-columns:1fr!important}}
</style>

<style id="aboarida-readable-panels-fix">
/* Dark theme: keep lesson and question panels readable without whitening the whole page. */
body:not(.aa-light) :is(.q-box,.lesson-content,.example-box,.text-box,.translation-box,.vocab-box,.questions-box,.definition,.example,.idiom-card,.info,.info-box,.content-box,.passage,.note,.highlight,.tree-diagram,.image-box) {
  background: #f8fafc !important;
  color: #1e293b !important;
  border-color: #cbd5e1 !important;
}
body:not(.aa-light) :is(.q-box,.lesson-content,.example-box,.text-box,.translation-box,.vocab-box,.questions-box,.definition,.example,.idiom-card,.info,.info-box,.content-box,.passage,.note,.highlight,.tree-diagram,.image-box) :is(p,li,span,strong,b,em,small,label,td,th,h1,h2,h3,h4,summary,blockquote) {
  color: #1e293b !important;
}
/* Preserve blue headings and colored callouts where they are intentionally used. */
body:not(.aa-light) :is(.q-box,.lesson-content,.example-box,.text-box,.translation-box,.vocab-box,.questions-box,.definition,.example,.idiom-card,.info,.info-box,.content-box,.passage,.note,.highlight,.tree-diagram,.image-box) a {
  color: #1d4ed8 !important;
}
/* Multiple-choice answers stay readable and retain clear result feedback. */
body:not(.aa-light) .options li {
  color: #1e293b !important;
  background: #ffffff !important;
  border-color: #cbd5e1 !important;
}
.options li.correct {
  color: #14532d !important;
  background: #bbf7d0 !important;
  border: 2px solid #22c55e !important;
  font-weight: 700 !important;
}
.options li.wrong {
  color: #7f1d1d !important;
  background: #fecaca !important;
  border: 2px solid #ef4444 !important;
  font-weight: 700 !important;
}
</style>

<script id="abo-arida-site-ui">
(function(){
 const bar=document.createElement('nav');bar.className='aa-topbar';bar.setAttribute('aria-label','التنقل الرئيسي');
 bar.innerHTML='<a class="aa-brand" href="index.html"><span class="aa-logo">📚</span><span>أبو عريضة أكاديمي<small>ABO ARIDA ACADEMY</small></span></a><div class="aa-actions"><a class="aa-action" href="index.html">الرئيسية</a><button class="aa-action" type="button" id="aaTheme">☀️ / 🌙</button></div>';
 document.body.insertBefore(bar,document.body.firstChild);
 const key='aboAridaTheme';function apply(v){document.body.classList.toggle('aa-light',v==='light');}
 let saved='dark';try{saved=localStorage.getItem(key)||'dark'}catch(e){}apply(saved);
 const btn=document.getElementById('aaTheme');btn.addEventListener('click',function(){const next=document.body.classList.contains('aa-light')?'dark':'light';apply(next);try{localStorage.setItem(key,next)}catch(e){}});
})();
