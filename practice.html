<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الأسئلة والاختبارات | أبو عريضة أكاديمي</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#071329,#0b1d39);color:#edf4ff;font-family:Tahoma,Arial,sans-serif}

</style></head><body><nav class="aa-topbar"><a class="aa-brand" href="index.html">📚 أبو عريضة أكاديمي</a><div class="aa-actions"><a class="aa-action" href="index.html">الرئيسية</a><button class="aa-action" id="aaTheme">☀️ / 🌙</button></div></nav><main><h1>الأسئلة والاختبارات</h1></main><script>(function(){const k='aboAridaTheme';let v='dark';try{v=localStorage.getItem(k)||'dark'}catch(e){}function set(x){document.body.classList.toggle('aa-light',x==='light')}set(v);document.getElementById('aaTheme').onclick=()=>{v=document.body.classList.contains('aa-light')?'dark':'light';set(v);try{localStorage.setItem(k,v)}catch(e){}}})();</script></body></html>
